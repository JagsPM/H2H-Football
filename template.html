<title>Elo Head-to-Head</title>
<style>
/* Layout: one working page. Controls on top, a face-off header with Elo, then comparison + fair-odds side by side, Elo history below, form and head-to-head last. */
:root {
  --bg: #f4f4f1;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink2: #52514e;
  --muted: #706e69;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --line: rgba(11,11,11,0.12);
  --wash: #efeeea;
  --a: #2a78d6;
  --b: #eb6834;
  --good: #006300;
  --bad: #b02a2a;
  --warnbg: #fdf1d6;
  --warnink: #6b4a00;
  --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97;
    --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,0.12); --wash: #242423;
    --a: #3987e5; --b: #d95926; --good: #3fbf3f; --bad: #ee7c7c; --warnbg: #3a2f10; --warnink: #f3d78a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97;
  --grid: #2c2c2a; --axis: #383835; --line: rgba(255,255,255,0.12); --wash: #242423;
  --a: #3987e5; --b: #d95926; --good: #3fbf3f; --bad: #ee7c7c; --warnbg: #3a2f10; --warnink: #f3d78a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 56px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.02rem; font-weight: 650; }
.sub { color: var(--ink2); margin: 4px 0 0; max-width: 62ch; }
.top { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: flex-end; }
.fresh { font-family: var(--font-num); font-size: 0.78rem; color: var(--ink2); background: var(--wash); border-radius: 6px; padding: 6px 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card > h2 { margin-bottom: 12px; }

/* controls */
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: end; }
.teams-pick { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .legend-l { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
select, input[type=text], input[type=number] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 7px; padding: 9px 10px; width: 100%; min-width: 0; }
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.pair { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 8px; min-width: 0; }
.pickA #selA { border-left: 5px solid var(--a); }
.pickB #selB { border-left: 5px solid var(--b); }
.swap { font: inherit; background: var(--wash); color: var(--ink); border: 1px solid var(--axis); border-radius: 7px; padding: 9px 12px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: var(--surface); }
.field .seg { width: 100%; }
.seg button { min-width: 0; font: inherit; font-size: 0.9rem; background: transparent; color: var(--ink); border: 0; padding: 9px 13px; cursor: pointer; flex: 1; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--axis); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

/* face-off */
.faceoff { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 6px; border-top-width: 5px; }
.team.a { border-top-color: var(--a); }
.team.b { border-top-color: var(--b); text-align: right; }
.team .nm { font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
.team .lg { color: var(--ink2); font-size: 0.85rem; }
.team .elo { font-family: var(--font-num); font-size: 2.1rem; font-weight: 600; line-height: 1.05; }
.team .rk { font-family: var(--font-num); font-size: 0.78rem; color: var(--ink2); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.team.b .badges { justify-content: flex-end; }
.badge { font-size: 0.74rem; background: var(--warnbg); color: var(--warnink); border-radius: 5px; padding: 3px 7px; }
.vs { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: var(--font-num); text-align: center; padding-inline: 4px; }
.vs .d { font-size: 1.15rem; font-weight: 600; }
.vs .t { font-size: 0.72rem; color: var(--ink2); max-width: 11ch; }

/* layout */
.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }

/* comparison rows */
.cmp { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 4.6rem 1fr 1fr 4.6rem; column-gap: 4px; padding-block: 8px; border-top: 1px solid var(--grid); align-items: center; }
.row:first-child { border-top: 0; }
.rlabel { grid-column: 1 / -1; text-align: center; font-size: 0.8rem; color: var(--ink2); margin-bottom: 4px; }
.rlabel small { color: var(--muted); font-size: 0.72rem; }
.num { font-family: var(--font-num); font-size: 0.95rem; }
.num.l { text-align: left; } .num.r { text-align: right; }
.num.lead { font-weight: 700; }
.num.lead::before { content: "\25CF\00a0"; font-size: 0.6em; vertical-align: middle; }
.num.r.lead::before { content: ""; }
.num.r.lead::after { content: "\00a0\25CF"; font-size: 0.6em; vertical-align: middle; }
.track { height: 10px; background: var(--wash); border-radius: 3px; display: flex; overflow: hidden; }
.track.ta { justify-content: flex-end; }
.track i { display: block; height: 100%; }
.track.ta i { background: var(--a); border-radius: 4px 0 0 4px; }
.track.tb i { background: var(--b); border-radius: 0 4px 4px 0; }
.row .dim { opacity: 0.55; }
.row.text .mid { grid-column: 2 / 4; text-align: center; font-family: var(--font-num); font-size: 0.8rem; color: var(--ink2); }
.note { color: var(--ink2); font-size: 0.82rem; margin: 10px 0 0; }

/* odds */
.venue .seg { flex-direction: column; width: 100%; }
.venue .seg button { text-align: left; white-space: normal; padding: 8px 12px; }
.venue .seg button + button { border-left: 0; border-top: 1px solid var(--axis); }
.venue { margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.xg { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.xg div { background: var(--wash); border-radius: 8px; padding: 8px 12px; font-size: 0.78rem; color: var(--ink2); flex: 1; min-width: 7rem; }
.xg b { display: block; font-family: var(--font-num); font-size: 1.2rem; color: var(--ink); font-weight: 600; }
.xg .sa { border-left: 4px solid var(--a); } .xg .sb { border-left: 4px solid var(--b); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: right; font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink2); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 7px 6px; border-bottom: 1px solid var(--grid); text-align: right; font-family: var(--font-num); white-space: nowrap; }
td:first-child { font-family: var(--font-ui); white-space: normal; min-width: 6.5rem; }
td input { width: 4.6rem; padding: 6px 7px; font-family: var(--font-num); text-align: right; }
.grp td { font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); background: var(--wash); border-bottom: 0; }
.ev { font-size: 0.82rem; }
.ev.pos { color: var(--good); font-weight: 600; }
.ev.neg { color: var(--bad); }
.scores { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-family: var(--font-num); font-size: 0.8rem; background: var(--wash); border-radius: 6px; padding: 4px 8px; }
.margin { margin: 10px 0 0; font-size: 0.82rem; color: var(--ink2); font-family: var(--font-num); }

/* chart */
.chartbox { position: relative; }
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-num); font-size: 11px; fill: var(--ink2); }
.chart .endl { font-weight: 600; fill: var(--ink); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 7px 10px; font-size: 0.78rem; font-family: var(--font-num); box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap; z-index: 2; }
.tip .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; font-size: 0.85rem; }
.legend span::before { content: ""; display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 7px; vertical-align: middle; background: var(--c); }

/* form + h2h */
.formrow { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.formrow .who { font-size: 0.85rem; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.formrow .who::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.fc { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; font-family: var(--font-num); font-size: 0.78rem; font-weight: 600; cursor: default; border: 1px solid var(--axis); }
.fc.W { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fc.D { background: var(--wash); color: var(--ink); }
.fc.L { background: transparent; color: var(--ink2); border-style: dashed; }
.h2h-sum { font-family: var(--font-num); font-size: 0.88rem; margin-bottom: 10px; }
.h2h td, .h2h th { font-size: 0.8rem; }
.h2h td, .h2h th { text-align: left; }
.h2h td { white-space: normal; }
.empty { color: var(--ink2); font-size: 0.9rem; }
details.card summary { cursor: pointer; font-weight: 650; }
details.card .body { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; max-width: 80ch; color: var(--ink2); font-size: 0.9rem; }
details.card .body p { margin: 0; }
.foot { color: var(--muted); font-size: 0.78rem; max-width: 90ch; }
.foot a { color: inherit; }

@media (max-width: 860px) {
  .main, .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .faceoff { grid-template-columns: minmax(0, 1fr); }
  .team.b { text-align: left; } .team.b .badges { justify-content: flex-start; }
  .vs { flex-direction: row; gap: 10px; padding-block: 2px; }
  .vs .t { max-width: none; }
  .teams-pick { grid-template-columns: minmax(0, 1fr); }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .swap { justify-self: start; }
  .row { grid-template-columns: 4rem 1fr 1fr 4rem; }
}
@media (prefers-reduced-motion: no-preference) { .track i { transition: width .25s ease; } }
.topright { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.langsel { width: auto; min-width: 8rem; font: inherit; font-size: 0.85rem; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
@media (max-width: 640px) { .topright { align-items: flex-start; } }
.pred { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 4px 0 12px; background: var(--wash); display: grid; gap: 8px; }
.pred .pt { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.pred .pk { font-size: 1.25rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.pred .pk .num { font-size: 1.05rem; color: var(--ink2); font-weight: 600; }
.pred .ps { font-size: 0.88rem; color: var(--ink); }
.pred .pbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.pred .pbar i { display: block; min-width: 2px; }
.pred .pleg { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8rem; color: var(--ink2); flex-wrap: wrap; }
.pred .pn { font-size: 0.78rem; color: var(--ink2); margin: 0; }
.disc .body p { margin: 0 0 8px; font-size: 0.86rem; color: var(--ink2); }
.disc .body b { color: var(--ink); }
</style>

<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var T = D.teams, MD = D.model;
  var prof = {};
  D.prof.forEach(function (p) { prof[p.i] = p; });

  // <model>
  var MAXG = 10;
  var FACT = [1];
  for (var q = 1; q <= MAXG; q++) FACT.push(FACT[q - 1] * q);
  function tau(x, y, lh, la, rho) {
    if (x === 0 && y === 0) return 1 - lh * la * rho;
    if (x === 0 && y === 1) return 1 + lh * rho;
    if (x === 1 && y === 0) return 1 + la * rho;
    if (x === 1 && y === 1) return 1 - rho;
    return 1;
  }
  function goalRates(rh, ra, neutral, M) {
    if (neutral) {
      var ac = (M.ah + M.aa) / 2, xn = (rh - ra) / 400;
      return [Math.exp(ac + M.b * xn), Math.exp(ac - M.b * xn)];
    }
    var x = (rh - ra + M.hfa) / 400;
    return [Math.exp(M.ah + M.b * x), Math.exp(M.aa - M.b * x)];
  }
  function scoreMatrix(lh, la, rho) {
    var P = [], s = 0, x, y;
    for (x = 0; x <= MAXG; x++) {
      P.push([]);
      for (y = 0; y <= MAXG; y++) {
        var v = Math.exp(-lh) * Math.pow(lh, x) / FACT[x] * Math.exp(-la) * Math.pow(la, y) / FACT[y] * tau(x, y, lh, la, rho);
        P[x].push(v); s += v;
      }
    }
    for (x = 0; x <= MAXG; x++) for (y = 0; y <= MAXG; y++) P[x][y] /= s;
    return P;
  }
  function transpose(P) {
    var Q = [];
    for (var y = 0; y <= MAXG; y++) { Q.push([]); for (var x = 0; x <= MAXG; x++) Q[y].push(P[x][y]); }
    return Q;
  }
  // P[a][b] = probability A scores a and B scores b
  function summarize(P) {
    var pw = 0, pd = 0, pl = 0, over = 0, bt = 0, all = [];
    for (var x = 0; x <= MAXG; x++) for (var y = 0; y <= MAXG; y++) {
      var p = P[x][y];
      if (x > y) pw += p; else if (x === y) pd += p; else pl += p;
      if (x + y >= 3) over += p;
      if (x > 0 && y > 0) bt += p;
      all.push([x, y, p]);
    }
    all.sort(function (u, v) { return v[2] - u[2]; });
    return { pw: pw, pd: pd, pl: pl, over: over, under: 1 - over, bty: bt, btn: 1 - bt, top: all.slice(0, 6) };
  }
  // venue: 'H' team A home, 'A' team B home, 'N' neutral. Returns {la, lb, P (A perspective)}
  function eloModel(rA, rB, venue) {
    var lh, la, P;
    if (venue === "H") { var r1 = goalRates(rA, rB, false, MD); P = scoreMatrix(r1[0], r1[1], MD.rho); return { la: r1[0], lb: r1[1], P: P }; }
    if (venue === "A") { var r2 = goalRates(rB, rA, false, MD); P = transpose(scoreMatrix(r2[0], r2[1], MD.rho)); return { la: r2[1], lb: r2[0], P: P }; }
    var r3 = goalRates(rA, rB, true, MD); P = scoreMatrix(r3[0], r3[1], MD.rho);
    return { la: r3[0], lb: r3[1], P: P };
  }
  function expectedPoints(rs, ro, v) {
    var m = eloModel(rs, ro, v === 1 ? "H" : (v === 0 ? "A" : "N"));
    var s = summarize(m.P);
    return 3 * s.pw + s.pd;
  }
  function rawModel(sa, sb, venue) {
    var g = (MD.mu_h + MD.mu_a) / 2, k = 4;
    function shr(x, n) { return (n * x + k * g) / (n + k); }
    var attA = shr(sa.gf, sa.n) / g, defA = shr(sa.ga, sa.n) / g, attB = shr(sb.gf, sb.n) / g, defB = shr(sb.ga, sb.n) / g;
    var la, lb;
    if (venue === "H") { la = MD.mu_h * attA * defB; lb = MD.mu_a * attB * defA; }
    else if (venue === "A") { lb = MD.mu_h * attB * defA; la = MD.mu_a * attA * defB; }
    else { la = g * attA * defB; lb = g * attB * defA; }
    var P = venue === "A" ? transpose(scoreMatrix(lb, la, MD.rho)) : scoreMatrix(la, lb, MD.rho);

      h5: "<b>Prueba.</b> En {n} partidos posteriores a julio de 2024, con los que el modelo no se ajustó, fue un {imp} % mejor que una referencia simple de frecuencias en log-loss. Acertó el resultado en el {acc} % de los partidos frente al {accH} % de apostar siempre por la victoria local. Es útil, pero las casas de apuestas siguen siendo mejores.",
      h6: "<b>Lo que el modelo no sabe.</b> Lesiones, sanciones, cambios de entrenador, motivación, clima, xG y tiros. Los datos solo contienen resultados. Los equipos de fuera de las siete ligas solo tienen partidos europeos, por lo que su rating es menos fiable. Los últimos partidos de liga en los datos son del {date}."

      thDate: "Datum", thComp: "Wettbewerb", thMatch: "Spiel", qual: "Quali",
      h1: "<b>Elo.</b> Jedes Team hat eine Zahl. Ein Team gewinnt Punkte vom Gegner, wenn es besser abschneidet als erwartet, und verliert sie sonst. Der Heimvorteil zählt {hfa} Elo-Punkte, und hohe Siege verschieben das Rating stärker als knappe. Ligaspiele bewegen das Rating mit K = {kd}, europäische Spiele mit K = {ke}.",
      h2: "<b>Über Ligen hinweg.</b> Die Ligen sind seit 2011 über Champions League, Europa League und Conference League verbunden. Die Ligastärke ist so eingestellt, dass europäische Ergebnisse im Schnitt zu den Ratings passen. Durchschnittliches Elo der Teams in der Liste: Premier League {m1}, La Liga {m2}, Bundesliga {m3}, Serie A {m4}, Ligue 1 {m5}.",
      h3: "<b>Roh oder bereinigt.</b> Rohwerte sind einfache Durchschnitte über die letzten Spiele. Bereinigt heißt, dass die Tore jedes Spiels nach dem Elo des Gegners und dem Spielort skaliert werden. Ein 2:0 gegen einen Topklub zählt also mehr als ein 2:0 gegen einen Abstiegskandidaten.",
      h4: "<b>Quoten.</b> Die Elo-Differenz wird in erwartete Tore für jedes Team und dann in Wahrscheinlichkeiten für Ausgang, Über/Unter und Beide treffen umgerechnet. Die faire Quote ist 1 geteilt durch die Wahrscheinlichkeit. Der Edge ist Wahrscheinlichkeit mal deine Quote minus 1.",
      h5: "<b>Test.</b> Auf {n} Spielen nach Juli 2024, an die das Modell nicht angepasst wurde, war es beim Log-Loss {imp} % besser als eine einfache Häufigkeits-Basislinie. Es traf den richtigen Ausgang in {acc} % der Spiele, gegenüber {accH} %, wenn man immer auf den Heimsieg tippt. Das ist brauchbar, aber die Buchmacher sind weiterhin besser.",
      h6: "<b>Was das Modell nicht weiß.</b> Verletzungen, Sperren, Trainerwechsel, Motivation, Wetter, xG und Schüsse. Die Daten enthalten nur Ergebnisse. Teams außerhalb der sieben Ligen haben nur europäische Spiele, ihr Rating ist daher unsicherer. Die jüngsten Ligaspiele in den Daten sind vom {date}."
    }

    MDA: ["Moldova", "Moldova", "Moldavia", "Moldau"], NIR: ["Nordirland", "Northern Ireland", "Irlanda del Norte", "Nordirland"], ROU: ["Rumænien", "Romania", "Rumanía", "Rumänien"],
    SVK: ["Slovakiet", "Slovakia", "Eslovaquia", "Slowakei"], WAL: ["Wales", "Wales", "Gales", "Wales"]

  var L = "da";

  // ---------- formatting
  function nf(x, d) { if (x == null || isNaN(x)) return "–"; d = d == null ? 2 : d; return x.toLocaleString(LOC[L], { minimumFractionDigits: d, maximumFractionDigits: d }); }
  function pct(x, d) { return nf(x * 100, d == null ? 0 : d) + " %"; }

  var rankOf = {};

  var BIG = { ENG: 1, GER: 1, ESP: 1, ITA: 1, FRA: 1, NED: 1, POR: 1 };
  var MAIN = ["ENG", "ESP", "GER", "ITA", "FRA", "NED", "POR"];
  var codes = [];

  function fillLeague(el) {
    function o(c) { return '<option value="' + c + '">' + esc(leagueName(c)) + "</option>"; }
    var other = codes.filter(function (c) { return !BIG[c]; }).sort(function (x, y) { return leagueName(x).localeCompare(leagueName(y), LOC[L]); });
    el.innerHTML = '<optgroup label="' + esc(t("groupMain")) + '">' + MAIN.map(o).join("") + '</optgroup><optgroup label="' + esc(t("groupOther")) + '">' + other.map(o).join("") + "</optgroup>";
  }
  function teamsIn(c) {
    return sel.filter(function (i) { return T[i].c === c; }).sort(function (a, b) { return T[a].name.localeCompare(T[b].name, LOC[L]); });
  }
  function strongest(c) { return teamsIn(c).sort(function (a, b) { return T[b].r - T[a].r; })[0]; }
  function fillTeams(el, c, chosen) {
    el.innerHTML = teamsIn(c).map(function (i) { return '<option value="' + i + '">' + esc(T[i].name) + "</option>"; }).join("");
    el.value = String(chosen);
  }
  function syncPick(side) {
    var idx = side === "A" ? S.a : S.b;
    $("lg" + side).value = T[idx].c;
    fillTeams($("sel" + side), T[idx].c, idx);
  }
  function findId(id) { for (var i = 0; i < T.length; i++) if (T[i].id === id) return i; return sel[0]; }

  var S = { a: findId("ENG:arsenal"), b: findId("GER:bayern munchen"), mode: "adj", win: 10, comp: "all", venue: "H" };
  try {

  } catch (e) {}
  function persist() { try { localStorage.setItem("elo-h2h", JSON.stringify({ a: S.a, b: S.b })); } catch (e) {} }

  // ---------- window + stats
  function toDate(n) { return new Date(Math.floor(n / 10000), (Math.floor(n / 100) % 100) - 1, n % 100); }
  function toInt(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function windowOf(idx) {
    var ms = prof[idx].m.slice();
    if (S.comp === "league") ms = ms.filter(function (m) { return m[1] <= 6; });
    if (!ms.length) return [];
    var last = toDate(ms[ms.length - 1][0]);

      gf += f; ga += a;

      if (a === 0) cs++;
      if (f > 0 && a > 0) bt++;
      if (f + a >= 3) ov++;
      sos += ro;
      var s = v === 1 ? 1 : (v === 0 ? -1 : 0);
      var adj = Math.exp(MD.b * ((ro - MD.r_ref) - s * MD.hfa) / 400);

             exp: ex / n, over: ppg - ex / n, agf: agf / n, aga: aga / n, agd: (agf - aga) / n };

  // ---------- rows
  function rowHTML(r) {

    var leadA = false, leadB = false;

  var cur = {};

      '<div class="vs"><div class="d">' + (ed >= 0 ? "A " : "B ") + "+" + Math.abs(ed) + '</div><div class="t">' + esc(t("diffLbl")) + "</div></div>" + card(S.b, "b");

    var rows = [];
    rows.push({ label: t("rElo"), sub: t("rEloSub"), a: ta.r, b: tb.r, fmt: function (v) { return String(v); }, better: "high", eps: 0.5 });
    if (sa && sb) {
      if (adj) {
        rows.push({ label: t("rSos"), sub: t("rSosSub"), a: sa.sos, b: sb.sos, fmt: function (v) { return nf(v, 0); }, better: "high", eps: 5 });
        rows.push({ label: t("rPpg"), sub: t("rPpgSub"), a: sa.ppg, b: sb.ppg, fmt: function (v) { return nf(v, 2); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rExp"), sub: t("rExpSub"), a: sa.exp, b: sb.exp, fmt: function (v) { return nf(v, 2); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rOver"), sub: t("rOverSub"), a: sa.over, b: sb.over, fmt: function (v) { return sgn(v, 2); }, better: "high", eps: 0.005 });
        rows.push({ label: t("rAgf"), sub: t("rAgfSub"), a: sa.agf, b: sb.agf, fmt: function (v) { return nf(v, 2); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rAga"), sub: t("lowerBetter"), a: sa.aga, b: sb.aga, fmt: function (v) { return nf(v, 2); }, better: "low", eps: 0.005, bar: true });
        rows.push({ label: t("rAgd"), a: sa.agd, b: sb.agd, fmt: function (v) { return sgn(v, 2); }, better: "high", eps: 0.005 });
      } else {
        rows.push({ label: t("rPpg"), a: sa.ppg, b: sb.ppg, fmt: function (v) { return nf(v, 2); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rGf"), a: sa.gf, b: sb.gf, fmt: function (v) { return nf(v, 2); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rGa"), sub: t("lowerBetter"), a: sa.ga, b: sb.ga, fmt: function (v) { return nf(v, 2); }, better: "low", eps: 0.005, bar: true });
        rows.push({ label: t("rGd"), a: sa.gd, b: sb.gd, fmt: function (v) { return sgn(v, 2); }, better: "high", eps: 0.005 });
        rows.push({ label: t("rCs"), a: sa.cs, b: sb.cs, fmt: function (v) { return pct(v); }, better: "high", eps: 0.005, bar: true });
        rows.push({ label: t("rBt"), a: sa.bt, b: sb.bt, fmt: function (v) { return pct(v); }, bar: true });
        rows.push({ label: t("rOv"), a: sa.ov, b: sb.ov, fmt: function (v) { return pct(v); }, bar: true });
      }
      rows.push({ label: t("rWdl"), a: sa.W + "–" + sa.D + "–" + sa.L, b: sb.W + "–" + sb.D + "–" + sb.L, fmt: function (v) { return v; } });
    }
    $("cmpTitle").textContent = adj ? t("cmpAdj") : t("cmpRaw");
    $("cmpRows").innerHTML = rows.map(rowHTML).join("");
    var nn = sa && sb ? t("noteBase", { na: sa.n, a: esc(ta.name), nb: sb.n, b: esc(tb.name) }) : t("noteNone");
    $("cmpNote").innerHTML = nn + (adj ? t("noteAdj", { ref: Math.round(MD.r_ref) }) : t("noteRaw"));

    renderOdds();
    renderChart();
    renderForm();
    renderH2H();
  }

  // ---------- odds panel
  var oddsVals = {};
  var MK = [];
  function renderOdds() {
    var ta = T[S.a], tb = T[S.b], sa = cur.sa, sb = cur.sb, adj = S.mode === "adj";
    $("vH").textContent = t("homeAt", { team: ta.name });
    $("vA").textContent = t("homeAt", { team: tb.name });
    ["H", "A", "N"].forEach(function (k) { $("v" + k).setAttribute("aria-pressed", String(S.venue === k)); });
    var m;
    if (adj) m = eloModel(ta.r, tb.r, S.venue);
    else if (sa && sb) m = rawModel(sa, sb, S.venue);
    if (!m) { $("pred").innerHTML = ""; $("odds").innerHTML = ""; $("xg").innerHTML = '<span class="empty">' + esc(t("noOdds")) + "</span>"; $("scores").innerHTML = ""; $("margin").textContent = ""; $("oddsNote").textContent = ""; return; }
    var s = summarize(m.P);
    var best = s.pw >= s.pd && s.pw >= s.pl ? ["w", s.pw, t("wins", { team: ta.name })] : (s.pl >= s.pd ? ["l", s.pl, t("wins", { team: tb.name })] : ["d", s.pd, t("draw")]);
    var tp = s.top[0];
    $("pred").innerHTML = '<div class="pt">' + esc(t("predTitle")) + '</div><div class="pk"><span>' + esc(best[2]) + '</span><span class="num">' + pct(best[1], 0) + '</span></div>' +
      '<div class="ps">' + esc(t("predSub", { s: tp[0] + "–" + tp[1], p: pct(tp[2], 1), a: nf(m.la, 1), b: nf(m.lb, 1) })) + '</div>' +
      '<div class="pbar" role="img" aria-label="' + esc(t("wins", { team: ta.name }) + " " + pct(s.pw, 0) + ", " + t("draw") + " " + pct(s.pd, 0) + ", " + t("wins", { team: tb.name }) + " " + pct(s.pl, 0)) + '"><i style="flex:' + s.pw.toFixed(4) + ';background:var(--a)"></i><i style="flex:' + s.pd.toFixed(4) + ';background:var(--muted)"></i><i style="flex:' + s.pl.toFixed(4) + ';background:var(--b)"></i></div>' +
      '<div class="pleg"><span>' + esc(ta.name) + " " + pct(s.pw, 0) + "</span><span>" + esc(t("draw")) + " " + pct(s.pd, 0) + "</span><span>" + esc(tb.name) + " " + pct(s.pl, 0) + "</span></div>" +
      (best[0] !== "d" ? '<p class="pn">' + esc(t("predNote")) + "</p>" : "");
    $("xg").innerHTML = '<div class="sa"><b>' + nf(m.la, 2) + "</b>" + esc(t("xgLbl", { team: ta.name })) + '</div><div class="sb"><b>' + nf(m.lb, 2) + "</b>" + esc(t("xgLbl", { team: tb.name })) + "</div>";
    MK = [
      { g: t("g1x2"), k: "w", lab: t("wins", { team: ta.name }), p: s.pw },
      { k: "d", lab: t("draw"), p: s.pd },
      { k: "l", lab: t("wins", { team: tb.name }), p: s.pl },
      { g: t("gGoals"), k: "o", lab: t("over"), p: s.over },
      { k: "u", lab: t("under"), p: s.under },
      { g: t("gBtts"), k: "y", lab: t("yes"), p: s.bty },
      { k: "n", lab: t("no"), p: s.btn }
    ];
    var h = "<thead><tr><th>" + esc(t("thOutcome")) + "</th><th>" + esc(t("thModel")) + "</th><th>" + esc(t("thFair")) + "</th><th>" + esc(t("thOdds")) + "</th><th>" + esc(t("thEdge")) + "</th></tr></thead><tbody>";
    MK.forEach(function (x) {
      if (x.g) h += '<tr class="grp"><td colspan="5">' + esc(x.g) + "</td></tr>";
      h += "<tr><td>" + esc(x.lab) + "</td><td>" + pct(x.p, 1) + "</td><td>" + nf(1 / x.p, 2) + '</td><td><input type="text" inputmode="decimal" id="od_' + x.k + '" placeholder="–" aria-label="' + esc(t("oddsAria", { o: x.lab })) + '" value="' + esc(oddsVals[x.k] || "") + '"></td><td class="ev" id="ev_' + x.k + '">–</td></tr>';
    });
    $("odds").innerHTML = h + "</tbody>";
    MK.forEach(function (x) {
      $("od_" + x.k).addEventListener("input", function (e) { oddsVals[x.k] = e.target.value; updateEdges(); });
    });
    $("scores").innerHTML = '<span class="legend-l" style="align-self:center;margin-right:4px">' + esc(t("scoresLbl")) + "</span>" + s.top.map(function (tp) { return '<span class="chip">' + tp[0] + "–" + tp[1] + " · " + pct(tp[2], 1) + "</span>"; }).join("");
    $("oddsNote").innerHTML = adj ? esc(t("oddsNoteAdj", { a: ta.name })).replace(/&amp;/g, "&amp;") : esc(t("oddsNoteRaw"));
    updateEdges();
  }
  function parseOdds(v) { var x = parseFloat(String(v || "").replace(",", ".")); return x > 1 ? x : null; }
  function updateEdges() {
    var tri = [];
    MK.forEach(function (x) {
      var o = parseOdds(oddsVals[x.k]), el = $("ev_" + x.k);
      if (!el) return;
      if (!o) { el.textContent = "–"; el.className = "ev"; el.removeAttribute("title"); return; }
      var ev = x.p * o - 1;
      var tag = ev >= 0.03 ? " ▲" : (ev <= -0.03 ? " ▼" : "");
      el.textContent = sgn(ev * 100, 1) + " %" + tag;
      el.className = "ev " + (ev >= 0.03 ? "pos" : (ev <= -0.03 ? "neg" : ""));
      el.title = ev >= 0.03 ? t("evPos") : (ev <= -0.03 ? t("evNeg") : t("evFair"));
    });
    ["w", "d", "l"].forEach(function (k) { var o = parseOdds(oddsVals[k]); if (o) tri.push(1 / o); });
    $("margin").textContent = tri.length === 3 ? t("marginTxt", { x: nf((tri[0] + tri[1] + tri[2] - 1) * 100, 1) }) : t("marginHint");
  }

  // ---------- chart
  var SS = D.meta.series_start.split("-").map(Number);
  function monthLabel(i) { var tt = SS[1] - 1 + i; return MONTHS[L][tt % 12] + " " + (SS[0] + Math.floor(tt / 12)); }
  var CH = { W: 720, H: 260, l: 46, r: 96, t: 14, b: 26 };
  var chartCtx = null;
  function renderChart() {
    var bw = $("chartbox").clientWidth || 720;
    CH.W = Math.max(300, bw);
    var narrow = CH.W < 520;
    CH.H = narrow ? 230 : 260; CH.r = narrow ? 48 : 132; CH.l = narrow ? 38 : 46;
    $("chart").setAttribute("viewBox", "0 0 " + CH.W + " " + CH.H);
    var pa = prof[S.a], pb = prof[S.b], ta = T[S.a], tb = T[S.b];
    var n = pa.s.length;
    var vals = pa.s.concat(pb.s).filter(function (v) { return v != null; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = hi - lo > 400 ? 100 : 50;
    lo = Math.floor((lo - 10) / step) * step; hi = Math.ceil((hi + 10) / step) * step;
    function X(i) { return CH.l + (CH.W - CH.l - CH.r) * i / (n - 1); }
    function Y(v) { return CH.t + (CH.H - CH.t - CH.b) * (1 - (v - lo) / (hi - lo)); }
    var g = "", v;
    for (v = lo; v <= hi; v += step) g += '<line x1="' + CH.l + '" x2="' + (CH.W - CH.r) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--grid)" stroke-width="1"/><text x="' + (CH.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + "</text>";
    for (var i = 0; i < n; i++) {
      var tt = SS[1] - 1 + i;
      if (tt % 12 === 0) g += '<text x="' + X(i) + '" y="' + (CH.H - 6) + '" text-anchor="middle">' + (SS[0] + tt / 12) + "</text>";
    }
    function path(arr, color) {
      var d = "", started = false;
      arr.forEach(function (val, k) { if (val == null) return; d += (started ? "L" : "M") + X(k).toFixed(1) + " " + Y(val).toFixed(1); started = true; });
      return '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    function lastIdx(arr) { for (var k = arr.length - 1; k >= 0; k--) if (arr[k] != null) return k; return -1; }
    var la = lastIdx(pa.s), lb = lastIdx(pb.s);
    var ya = Y(pa.s[la]), yb = Y(pb.s[lb]);
    var oa = 0, ob = 0;
    if (Math.abs(ya - yb) < 15) { var sh = (15 - Math.abs(ya - yb)) / 2; if (ya <= yb) { oa = -sh; ob = sh; } else { oa = sh; ob = -sh; } }
    function short(s) { return s.length > 12 ? s.slice(0, 11) + "…" : s; }
    var svg = g + path(pa.s, "var(--a)") + path(pb.s, "var(--b)") +
      '<circle cx="' + X(la) + '" cy="' + ya + '" r="4.5" fill="var(--a)" stroke="var(--surface)" stroke-width="2"/><circle cx="' + X(lb) + '" cy="' + yb + '" r="4.5" fill="var(--b)" stroke="var(--surface)" stroke-width="2"/>' +
      '<text class="endl" x="' + (X(la) + 9) + '" y="' + (ya + oa + 4) + '">' + (narrow ? "" : esc(short(ta.name)) + " ") + pa.s[la] + "</text>" +
      '<text class="endl" x="' + (X(lb) + 9) + '" y="' + (yb + ob + 4) + '">' + (narrow ? "" : esc(short(tb.name)) + " ") + pb.s[lb] + "</text>" +
      '<line id="cross" x1="0" x2="0" y1="' + CH.t + '" y2="' + (CH.H - CH.b) + '" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>';
    $("chart").innerHTML = svg;
    $("legend").innerHTML = '<span style="--c:var(--a)">' + esc(ta.name) + '</span><span style="--c:var(--b)">' + esc(tb.name) + "</span>";
    chartCtx = { pa: pa, pb: pb, ta: ta, tb: tb, n: n, X: X, Y: Y };
    var th = "<thead><tr><th>" + esc(t("thDate")) + "</th><th>" + esc(ta.name) + "</th><th>" + esc(tb.name) + "</th></tr></thead><tbody>";
    for (var k = n - 1; k >= 0; k -= 6) th += "<tr><td>" + monthLabel(k) + "</td><td>" + (pa.s[k] == null ? "–" : pa.s[k]) + "</td><td>" + (pb.s[k] == null ? "–" : pb.s[k]) + "</td></tr>";
    $("eloTbl").innerHTML = th + "</tbody>";
  }
  (function bindChart() {
    var svgEl = $("chart"), tip = $("tip"), box = $("chartbox");
    function move(ev) {
      if (!chartCtx) return;
      var r = svgEl.getBoundingClientRect();
      var px = (ev.clientX - r.left) / r.width * CH.W;
      var c = chartCtx;
      var i = Math.round((px - CH.l) / (CH.W - CH.l - CH.r) * (c.n - 1));
      if (i < 0 || i > c.n - 1) { leave(); return; }
      var cross = $("cross");
      cross.setAttribute("x1", c.X(i)); cross.setAttribute("x2", c.X(i)); cross.setAttribute("visibility", "visible");
      tip.innerHTML = "<div>" + monthLabel(i) + '</div><div><span class="k" style="background:var(--a)"></span>' + esc(c.ta.name) + " " + (c.pa.s[i] == null ? "–" : c.pa.s[i]) + '</div><div><span class="k" style="background:var(--b)"></span>' + esc(c.tb.name) + " " + (c.pb.s[i] == null ? "–" : c.pb.s[i]) + "</div>";
      tip.hidden = false;
      var bx = box.getBoundingClientRect();
      var left = ev.clientX - bx.left + 14;
      if (left + tip.offsetWidth > bx.width) left = ev.clientX - bx.left - tip.offsetWidth - 14;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = "8px";
    }
    function leave() { tip.hidden = true; var cr = $("cross"); if (cr) cr.setAttribute("visibility", "hidden"); }
    svgEl.addEventListener("pointermove", move);
    svgEl.addEventListener("pointerleave", leave);
  })();

  // ---------- form + h2h
  function formHTML(idx, cls, ms) {
    var tm = T[idx];
    var last = ms.slice(-10);
    var h = '<div class="formrow" style="--c:var(' + (cls === "a" ? "--a" : "--b") + ')"><div class="who">' + esc(tm.name) + "</div>";
    if (!last.length) return h + '<span class="empty">' + esc(t("noMatches")) + "</span></div>";
    h += '<div class="chips">' + last.map(function (m) {
      var r = m[4] > m[5] ? "W" : (m[4] === m[5] ? "D" : "L");
      var venue = m[2] === 1 ? t("vHome") : (m[2] === 0 ? t("vAway") : t("vNeutral"));
      var ttl = dmy(m[0]) + " " + compLabel(m[1]) + " (" + venue + ") " + t("vsWord") + " " + T[m[3]].name + " " + m[4] + "–" + m[5];
      return '<span class="fc ' + r + '" title="' + esc(ttl) + '">' + t("f" + r) + "</span>";
    }).join("") + "</div>";
    var lm = last[last.length - 1];
    h += '<div class="num" style="font-size:0.78rem;color:var(--ink2)">' + esc(t("lastLbl", { d: dmy(lm[0]), o: T[lm[3]].name, s: lm[4] + "–" + lm[5] })) + "</div>";
    return h + "</div>";
  }
  function renderForm() {
    $("form").innerHTML = formHTML(S.a, "a", cur.wa) + formHTML(S.b, "b", cur.wb) + '<p class="note">' + esc(t("formNote")) + "</p>";
  }
  function renderH2H() {
    var ta = T[S.a], tb = T[S.b];
    var ms = D.h2h.filter(function (m) { return (m[1] === S.a && m[2] === S.b) || (m[1] === S.b && m[2] === S.a); });
    if (!ms.length) { $("h2h").innerHTML = '<p class="empty">' + esc(t("h2hEmpty")) + "</p>"; return; }
    var w = 0, d = 0, l = 0, gf = 0, ga = 0;
    ms.forEach(function (m) {
      var aHome = m[1] === S.a, f = aHome ? m[3] : m[4], a = aHome ? m[4] : m[3];
      gf += f; ga += a; if (f > a) w++; else if (f === a) d++; else l++;
    });
    var sum = t("h2hSum", { a: esc(ta.name), b: esc(tb.name), w: w, wl: w === 1 ? t("winOne") : t("winMany"), d: d, l: l, ll: l === 1 ? t("winOne") : t("winMany"), gf: gf, ga: ga, n: ms.length });
    var h = '<div class="h2h-sum">' + sum + "</div>";
    h += '<div class="tbl h2h"><table><thead><tr><th>' + esc(t("thDate")) + "</th><th>" + esc(t("thComp")) + "</th><th>" + esc(t("thMatch")) + "</th></tr></thead><tbody>";
    ms.slice(-8).reverse().forEach(function (m) {
      h += "<tr><td>" + dmy(m[0]) + "</td><td>" + compLabel(m[5]) + '</td><td style="font-family:var(--font-ui)">' + esc(T[m[1]].name) + ' <b class="num">' + m[3] + "–" + m[4] + "</b> " + esc(T[m[2]].name) + "</td></tr>";
    });
    $("h2h").innerHTML = h + "</tbody></table></div>";
  }

  // ---------- static copy
  function mean(c) { var a = sel.filter(function (i) { return T[i].c === c; }).map(function (i) { return T[i].r; }); return a.reduce(function (x, y) { return x + y; }, 0) / a.length; }
  function renderCopy() {
    var bt = D.meta.backtest;
    $("fresh").textContent = t("fresh", { a: dlong(D.meta.data_end), b: dlong(D.meta.last.CL) });
    var v = { hfa: MD.hfa, kd: MD.K_dom, ke: MD.K_eur, m1: Math.round(mean("ENG")), m2: Math.round(mean("ESP")), m3: Math.round(mean("GER")), m4: Math.round(mean("ITA")), m5: Math.round(mean("FRA")),
              n: bt.n.toLocaleString(LOC[L]), imp: nf((1 - bt.ll_model / bt.ll_base) * 100, 1), acc: nf(bt.acc * 100, 1), accH: nf(bt.acc_home * 100, 1), date: dlong(D.meta.data_end) };
    $("discBody").innerHTML = ["d1", "d2", "d3", "d4", "d5"].map(function (k) { return "<p>" + t(k) + "</p>"; }).join("");
    $("howto").innerHTML = ["h1", "h2", "h3", "h4", "h5", "h6"].map(function (k) { return "<p>" + t(k, v) + "</p>"; }).join("");
  }
  function applyStatic() {
    document.documentElement.lang = L;
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-aria]"), function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    Array.prototype.forEach.call($("win").options, function (o) { o.textContent = t("nMatches", { n: o.value }); });
  }

  // ---------- wire up
  function fullRender() {
    applyStatic();
    fillLeague($("lgA")); fillLeague($("lgB"));
    syncPick("A"); syncPick("B");
    renderCopy();
    renderAll();
  }
  $("lang").value = L;
  $("lang").addEventListener("change", function () {
    L = this.value;
    try { localStorage.setItem("elo-h2h-lang", L); } catch (e) {}
    fullRender();
  });
  function setPressed(ids, on) { ids.forEach(function (id) { $(id).setAttribute("aria-pressed", String(id === on)); }); }
  $("lgA").addEventListener("change", function () { S.a = strongest(this.value); syncPick("A"); oddsVals = {}; persist(); renderAll(); });
  $("lgB").addEventListener("change", function () { S.b = strongest(this.value); syncPick("B"); oddsVals = {}; persist(); renderAll(); });
  $("selA").addEventListener("change", function () { S.a = +this.value; oddsVals = {}; persist(); renderAll(); });
  $("selB").addEventListener("change", function () { S.b = +this.value; oddsVals = {}; persist(); renderAll(); });
  $("swap").addEventListener("click", function () { var tmp = S.a; S.a = S.b; S.b = tmp; syncPick("A"); syncPick("B"); oddsVals = {}; persist(); renderAll(); });
  $("mAdj").addEventListener("click", function () { S.mode = "adj"; setPressed(["mAdj", "mRaw"], "mAdj"); renderAll(); });
  $("mRaw").addEventListener("click", function () { S.mode = "raw"; setPressed(["mAdj", "mRaw"], "mRaw"); renderAll(); });
  $("win").addEventListener("change", function () { S.win = +this.value; renderAll(); });
  $("cmp").addEventListener("change", function () { S.comp = this.value; renderAll(); });
  ["H", "A", "N"].forEach(function (k) { $("v" + k).addEventListener("click", function () { S.venue = k; oddsVals = {}; renderAll(); }); });
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(renderChart, 150); });
  fullRender();
})();

</script>
